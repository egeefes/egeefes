name: Refresh README cards

on:
  schedule:
    - cron: "17 6 * * *"   # every morning
  workflow_dispatch:
  push:
    paths: ["scripts/**", "portrait.*", ".github/workflows/cards.yml"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools pillow
      - name: Fetch contributions
        run: python scripts/fetch_contributions.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
      - name: Render README cards (hero, graph, activity, tiles, repos)
        run: python scripts/render_readme_cards.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add cards data
          git diff --cached --quiet || git commit -m "Refresh README cards"
          git push
